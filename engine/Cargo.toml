[package]
name = "releaselens-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.37"
plist = "=1.7.2"
time = "=0.3.41"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
